name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :library:test
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-test-report
          path: library/build/reports/tests/

  publish-local:
    name: Maven publication (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :library:publishToMavenLocal
      - name: Verify artifacts
        run: |
          find ~/.m2/repository/com/hossamrakha -type f | tee artifacts.txt
          grep -q "auth-refresh-0.1.0.jar" artifacts.txt
          grep -q "auth-refresh-0.1.0-sources.jar" artifacts.txt
